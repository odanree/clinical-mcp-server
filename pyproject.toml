[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-mcp-server"
version = "0.1.0"
description = "MCP server exposing clinical literature + drug-label search over PubMed E-utils and openFDA. Consumable by Claude Desktop and any other MCP client."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Danh Le", email = "nightseek@yahoo.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "claude",
    "anthropic",
    "pubmed",
    "openfda",
    "clinical",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
clinical-mcp-server = "server.main:main"

[project.urls]
Homepage = "https://github.com/odanree/clinical-mcp-server"
Repository = "https://github.com/odanree/clinical-mcp-server"
Issues = "https://github.com/odanree/clinical-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
